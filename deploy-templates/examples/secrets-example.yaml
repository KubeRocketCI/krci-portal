# Example with actual values (DO NOT USE IN PRODUCTION):
# Environment variables are delivered by a single secret wired via `extraEnvFrom`
# (see values.yaml) — add new vars as keys here rather than creating dedicated
# secrets. INTERNAL_EVENTS_TOKEN enables POST /rest/v1/internal/events; the
# in-cluster Argo Events Sensor presents it via the `x-internal-events-token`
# header.
# apiVersion: v1
# kind: Secret
# metadata:
#   name: portal-secret
# type: Opaque
# stringData:  # Using stringData to avoid manual base64 encoding
#   INTERNAL_EVENTS_TOKEN: "your-shared-secret"
