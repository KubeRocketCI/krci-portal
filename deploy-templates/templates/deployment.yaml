apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krci-portal.fullname" . }}
  labels:
    {{- include "krci-portal.labels" . | nindent 4 }}
spec:
  {{- if .Values.persistence.enabled }}
  # ReadWriteOnce PVC forces Recreate: the old pod must release the volume before the new one mounts it.
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "krci-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/portal-config.yaml") . | sha256sum | trunc 63 }}
        checksum/secret: {{ include (print $.Template.BasePath "/external-secrets/externalsecret-portal-secret.yaml") . | sha256sum | trunc 63 }}
        {{- with include "krci-portal.tektonResultsCaCert" . }}
        checksum/tekton-results-ca: {{ . | sha256sum | trunc 63 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 6 }}
        {{- end }}
      labels:
        {{- include "krci-portal.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "krci-portal.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if include "krci-portal.tektonResultsCaCert" . }}
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: {{ include "krci-portal.tektonResultsCaDir" . }}/ca.crt
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.volumeMounts (include "krci-portal.tektonResultsCaCert" .) }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ include "krci-portal.dbMountPath" . }}
            {{- end }}
            {{- if include "krci-portal.tektonResultsCaCert" . }}
            - name: tekton-results-ca
              mountPath: {{ include "krci-portal.tektonResultsCaDir" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.volumes (include "krci-portal.tektonResultsCaCert" .) }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "krci-portal.fullname" .) }}
        {{- end }}
        {{- if include "krci-portal.tektonResultsCaCert" . }}
        - name: tekton-results-ca
          configMap:
            name: {{ include "krci-portal.fullname" . }}-tekton-results-ca
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
