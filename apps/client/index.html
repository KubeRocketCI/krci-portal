<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/krci-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/krci-logo.svg" as="image" />
    <link rel="preload" href="/krci-logo-with-text.svg" as="image" />
    <script>
      (function () {
        const THEME_STORAGE_KEY = "theme";
        const THEME_DARK = "dark";
        const stored = localStorage.getItem(THEME_STORAGE_KEY);
        const theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? THEME_DARK : "light");
        if (theme === THEME_DARK) {
          document.documentElement.classList.add(THEME_DARK);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/vite-preload-error.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
